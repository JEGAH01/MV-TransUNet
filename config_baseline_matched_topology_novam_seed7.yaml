project:
  name: "MV-TransUNet"
  version: "Baseline_Matched_Topology_NoVAM_Seed7"
  task: "retinal_vessel_segmentation"
  experiment: "strict_matched_topology_control_novam_ablation"

seed:
  value: 7
  deterministic: true

hardware:
  device: "cuda"
  mixed_precision: true
  cudnn_benchmark: false

dataset:
  name: "DRIVE"
  train_dataset:
    name: "DRIVE_train"
    image_dir: "datasets/DRIVE/training/image"
    mask_dir: "datasets/DRIVE/training/1st_manual"
  validation_ratio: 0.20
  split_seed: 42

patch_training:
  enabled: true
  patch_size: 256
  model_input_size: 256
  patches_per_image: 100
  validation_stride: 128

  vessel_center_probability: 0.60
  hard_negative_probability: 0.25
  random_probability: 0.15

  minimum_vessel_fraction: 0.01
  hard_negative_max_vessel_fraction: 0.005
  hard_negative_candidates: 20
  max_sampling_attempts: 20

  include_empty_validation_patches: true

  # Enabled: DRIVE-to-target vessel-scale gap augmentation.
  # Matched with config_topology_ablation_a5_scale_augmentation.yaml.
  # Conservative range chosen well below the raw Frangi-sigma ratio measured
  # between DRIVE (weighted median sigma 1.8750) and CHASE_DB1/HRF (8.4821 /
  # 9.8778 respectively, from src/calibrate_vessel_scale.py) to avoid the
  # instability documented in config_topology_backup.yaml and to avoid
  # destroying thin single-pixel targets under extreme downsampling.
  scale_augmentation:
    enabled: true
    probability: 0.8
    min_scale: 0.75
    max_scale: 2.0

preprocessing:
  image_size:
    height: 256
    width: 256
  channels: 3
  clahe:
    enabled: true

augmentation:
  enabled: true
  note: "Uses the synchronized training transform implemented by src.datasets.get_train_transform."

dataloader:
  batch_size: 2
  num_workers: 0
  pin_memory: true
  shuffle: true
  drop_last: false
  persistent_workers: false

model:
  name: "MVTransUNet"
  input_channels: 3
  output_channels: 1

  backbone:
    encoder: "resnet50"
    pretrained: true

  transformer:
    embed_dim: 768

  vessel_attention:
    reduction_ratio: 16
    # SC-VAM ablation: scale_conditioning=false removes the FiLM
    # scale-conditioning pathway from ChannelAttention entirely (the
    # scale_mlp submodule is never constructed when this is false --
    # see models/modules/vessel_attention.py), rather than merely
    # leaving it inert. Everything else (backbone, patch sampling,
    # scale augmentation, optimizer, scheduler, loss) is identical to
    # config_baseline_matched_topology_scvam_seed7.yaml.
    scale_conditioning: false

  decoder:
    dropout_rate: 0.10

  deep_supervision:
    enabled: true

baseline_loss:
  name: "MatchedBaselineLoss"
  segmentation_bce_weight: 0.50
  segmentation_dice_weight: 0.50
  auxiliary_weight: 0.20
  auxiliary_stage_weights: [0.25, 0.50, 0.75]

optimizer:
  name: "AdamW"
  learning_rate: 0.00005
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  epsilon: 0.00000001

scheduler:
  name: "ReduceLROnPlateau"
  mode: "max"
  factor: 0.5
  patience: 8
  threshold: 0.0001
  min_lr: 0.000001

training:
  epochs: 200
  gradient_accumulation_steps: 2

  gradient_clipping:
    enabled: true
    max_norm: 1.0

  early_stopping:
    enabled: true
    patience: 35

checkpoint:
  directory: "checkpoints/baseline_matched_novam_seed7"
  resume: false
  resume_from_best: false
  save_last: true
  save_best: true
  best_model_name: "best_model.pth"
  last_model_name: "last_model.pth"

logging:
  directory: "logs/baseline_matched_novam_seed7"
  tensorboard:
    enabled: true

validation:
  threshold: 0.5
